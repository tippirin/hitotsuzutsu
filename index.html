<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>ひとつずつ</title>
<meta name="theme-color" content="#EDF1F0" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0C1719" media="(prefers-color-scheme: dark)">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="ひとつずつ">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Noto+Sans+JP:wght@400;500;700&family=Zen+Maru+Gothic:wght@500;700&display=swap">
<style>
:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0;font-size:14px}
img{max-width:100%}
[hidden]{display:none!important}
</style>
<style>
/* Layout: a one-column phone app. Four views (today / week / list / habits) behind a bottom tab bar with a raised add button that opens a sheet. Tasks carry a colour and can be dragged by a grip. */
:root{
  --bg:#EDF1F0; --surface:#FFFFFF; --surface-2:#E2EAE9;
  --fg:#14262B; --muted:#4E6266;
  --line:#D2DDDC; --line-strong:#9FB3B3;
  --accent:#0B7A83; --accent-fg:#FFFFFF; --accent-soft:#CFE8EA; --accent-ink:#075E66;
  --warn:#B4400C; --warn-soft:#F7DFD2;
  --shadow:0 8px 28px rgba(20,38,43,.18);
  --c-teal:#0B7A83; --c-blue:#2F5FD0; --c-violet:#7A4FD1; --c-pink:#C63D86;
  --c-red:#CC3B33; --c-orange:#C46A0A; --c-green:#3C8A2E; --c-gray:#5F6F72; --on-c:#FFFFFF;
  --display:"Zen Maru Gothic","Hiragino Maru Gothic ProN","Hiragino Sans","Yu Gothic",sans-serif;
  --body:"Noto Sans JP","Hiragino Sans","Yu Gothic",system-ui,sans-serif;
  --mono:"DM Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0C1719; --surface:#132226; --surface-2:#1B2F34;
    --fg:#E4EFEF; --muted:#93AAAD;
    --line:#26393D; --line-strong:#3D575C;
    --accent:#4CC2CB; --accent-fg:#062226; --accent-soft:#17383C; --accent-ink:#8FDDE3;
    --warn:#F08D5A; --warn-soft:#3A2418;
    --shadow:0 8px 28px rgba(0,0,0,.55);
    --c-teal:#4CC2CB; --c-blue:#7FA2FF; --c-violet:#B396FF; --c-pink:#FF86C0;
    --c-red:#FF8279; --c-orange:#F5A649; --c-green:#8CD67B; --c-gray:#A3B4B7; --on-c:#0C1719;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0C1719; --surface:#132226; --surface-2:#1B2F34;
  --fg:#E4EFEF; --muted:#93AAAD;
  --line:#26393D; --line-strong:#3D575C;
  --accent:#4CC2CB; --accent-fg:#062226; --accent-soft:#17383C; --accent-ink:#8FDDE3;
  --warn:#F08D5A; --warn-soft:#3A2418;
  --shadow:0 8px 28px rgba(0,0,0,.55);
  --c-teal:#4CC2CB; --c-blue:#7FA2FF; --c-violet:#B396FF; --c-pink:#FF86C0;
  --c-red:#FF8279; --c-orange:#F5A649; --c-green:#8CD67B; --c-gray:#A3B4B7; --on-c:#0C1719;
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
body{
  background:var(--bg); color:var(--fg);
  font-family:var(--body); font-size:15px; line-height:1.6;
  padding-block:20px 128px;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
  -webkit-text-size-adjust:100%;
}
body.is-dragging{-webkit-user-select:none;user-select:none;cursor:grabbing}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:8px}
.wrap{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:20px}

/* header */
.top{display:flex;justify-content:space-between;align-items:flex-end;gap:12px}
.eyebrow{font-size:.75rem;color:var(--muted);letter-spacing:.08em}
h1{margin:0;font:700 1.75rem/1.3 var(--display);text-wrap:balance}
.sync{font-size:.6875rem;color:var(--muted);text-align:right;min-width:0}
.hint{margin:-8px 4px 0;font-size:.75rem;color:var(--muted)}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat{background:var(--surface);border-radius:16px;padding:12px 14px;display:flex;flex-direction:column;gap:6px;min-width:0}
.stat .k{font-size:.75rem;color:var(--muted);letter-spacing:.04em}
.stat .v{font:500 1.5rem/1 var(--mono);font-variant-numeric:tabular-nums}
.stat .v small{font-size:.875rem;color:var(--muted)}
.bar{height:6px;border-radius:3px;background:var(--surface-2);overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:3px;transition:width .25s}

/* sections and rows */
.sec{display:flex;flex-direction:column;gap:8px}
.sec.past .sec-h h2{color:var(--muted)}
.sec-h{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:0 4px}
.sec-h h2{margin:0;font:700 1rem/1.4 var(--display);display:flex;align-items:center;gap:8px}
.sec-h .n{font:400 .75rem/1 var(--mono);color:var(--muted)}
.group{list-style:none;margin:0;padding:0;background:var(--surface);border-radius:16px;overflow:hidden}
.group.over{outline:2px dashed var(--accent);outline-offset:-2px;background:var(--accent-soft)}
.row{display:flex;align-items:center;gap:10px;min-height:60px;padding:8px 8px 8px 12px}
.row.has-grip{padding-left:2px;gap:6px}
.row+.row{border-top:1px solid var(--line)}
.row.tint{background:color-mix(in srgb,var(--tc) 14%,var(--surface));min-height:54px}
.row.dragging{opacity:.35}
.row.drop-before{box-shadow:inset 0 3px 0 var(--accent)}
.row.drop-after{box-shadow:inset 0 -3px 0 var(--accent)}
.row.ghost{position:fixed;z-index:30;margin:0;border-radius:14px;box-shadow:var(--shadow);pointer-events:none;background:var(--surface);opacity:.96}
.row.ghost.tint{background:color-mix(in srgb,var(--tc) 22%,var(--surface))}
.row .t{flex:1;min-width:0;overflow-wrap:anywhere;text-align:left;padding:4px 0}
.row .t span{display:block}
.row .t small{display:block;font-size:.75rem;color:var(--muted);font-family:var(--mono);font-variant-numeric:tabular-nums}
.row .t small.memo{font-family:var(--body);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row.is-done .t{color:var(--muted)}
.row.is-done .t span{text-decoration:line-through}
.grip{flex:none;width:34px;height:44px;display:grid;place-items:center;color:var(--muted);border-radius:10px;touch-action:none;cursor:grab;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.grip:hover{color:var(--fg)}
.check{flex:none;width:44px;height:44px;display:grid;place-items:center;border-radius:50%;border:2px solid var(--tc,var(--line-strong));color:transparent;transition:background .15s,border-color .15s}
.check.sq{border-radius:12px;width:40px;height:40px}
.check[aria-pressed="true"]{background:var(--tc,var(--accent));border-color:var(--tc,var(--accent));color:var(--on-c)}
.chip{font:500 .6875rem/1 var(--mono);padding:5px 7px;border-radius:6px;background:var(--surface-2);color:var(--muted);flex:none}
.chip.today{background:var(--accent-soft);color:var(--accent-ink)}
.chip.late{background:var(--warn-soft);color:var(--warn)}
.x{flex:none;width:40px;height:44px;display:grid;place-items:center;color:var(--muted);border-radius:10px}
.x:hover{color:var(--warn)}
.empty{padding:20px 16px;text-align:center;color:var(--muted);font-size:.875rem}
.drop-empty{padding:16px;text-align:center;color:var(--muted);font-size:.8125rem;list-style:none}
.link{color:var(--accent-ink);font-size:.875rem;font-weight:500;padding:8px 4px;text-align:left}
.note{display:flex;align-items:center;justify-content:space-between;gap:12px;background:var(--accent-soft);color:var(--accent-ink);border-radius:12px;padding:10px 12px;font-size:.8125rem}
.note button{font-weight:700;text-decoration:underline;flex:none;padding:6px 4px}

/* small actions */
.hr{display:flex;align-items:center;gap:6px}
.mini{font-size:.8125rem;font-weight:700;color:var(--accent-ink);padding:6px 8px;border-radius:8px}
.ghost{position:fixed;z-index:30;margin:0;pointer-events:none;box-shadow:var(--shadow);opacity:.96}
.hcard.ghost{background:var(--surface)}
.hcard.dragging{opacity:.35}
.hcard.drop-before{box-shadow:inset 0 3px 0 var(--accent)}
.hcard.drop-after{box-shadow:inset 0 -3px 0 var(--accent)}
.cards.over{outline:2px dashed var(--accent);outline-offset:6px;border-radius:16px}
.hleft{display:flex;align-items:flex-start;gap:2px;min-width:0}
.hleft .grip{margin:-6px 0 -6px -8px}

/* data transfer */
.data{background:var(--surface);border-radius:16px}
.data summary{cursor:pointer;padding:14px 16px;font:700 .9375rem/1.4 var(--display);list-style:none}
.data summary::-webkit-details-marker{display:none}
.datab{display:flex;flex-direction:column;gap:10px;padding:0 16px 16px}
.datab p{margin:0;font-size:.8125rem;color:var(--muted)}
.datab .btn{flex:none}
.msg{min-height:1.2em;font-size:.8125rem;color:var(--accent-ink)}

/* habit cards */
.cards{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:12px}
.hcard{background:var(--surface);border-radius:16px;padding:14px 12px 12px;display:flex;flex-direction:column;gap:12px}
.hhead{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;padding:0 4px}
.hhead>div{min-width:0}
.hname{font:700 1.0625rem/1.4 var(--display);overflow-wrap:anywhere;text-align:left;display:block;padding:0}
.hmeta{font-size:.75rem;color:var(--muted);font-family:var(--mono);font-variant-numeric:tabular-nums}
.hmeta b{color:var(--fg);font-weight:500}
.del{font-size:.75rem;color:var(--muted);padding:6px 8px;border-radius:8px;flex:none}
.del:hover{color:var(--warn)}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.day{display:flex;flex-direction:column;align-items:center;gap:4px;padding:6px 0 4px;border-radius:12px;min-width:0}
.day.is-today{background:var(--surface-2)}
.day .dl{font-size:.6875rem;color:var(--muted)}
.day .dn{font:400 .6875rem/1 var(--mono);color:var(--muted)}
.day .dc{width:30px;height:30px;border-radius:50%;border:2px solid var(--line-strong);display:grid;place-items:center;color:transparent}
.day.off .dc{border-style:dashed;opacity:.5}
.day[aria-pressed="true"] .dc{background:var(--accent);border-color:var(--accent);border-style:solid;color:var(--accent-fg);opacity:1}

/* tab bar */
.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);
  padding:6px max(8px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px))}
.tabs-in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:1fr 64px 1fr;align-items:center;gap:8px}
.tab{display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 0;font-size:.6875rem;font-weight:500;color:var(--muted);border-radius:12px;min-width:0;white-space:nowrap}
.tab[aria-current="page"]{color:var(--accent-ink)}
.tab svg{width:24px;height:24px}
.plus{width:52px;height:52px;margin:-22px auto 0;border-radius:50%;background:var(--accent);color:var(--accent-fg);display:grid;place-items:center;box-shadow:var(--shadow)}

/* add / edit sheet */
.back{position:fixed;inset:0;background:rgba(8,18,20,.5);z-index:10}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:11;margin:0 auto;max-width:560px;background:var(--surface);
  border-radius:20px 20px 0 0;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:14px;
  max-height:92vh;overflow-y:auto;overscroll-behavior:contain;
  padding:16px max(16px,env(safe-area-inset-right,0px)) calc(16px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));
  animation:up .2s ease-out}
@keyframes up{from{transform:translateY(24px);opacity:0}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){.sheet{animation:none}.bar i,.check{transition:none}}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:4px;background:var(--surface-2);border-radius:12px;padding:4px}
.seg button{padding:8px 0;border-radius:9px;font-weight:500;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--fg);font-weight:700}
.field{width:100%;font-size:16px;padding:12px 14px;border-radius:12px;border:1.5px solid var(--line-strong);background:var(--bg);color:var(--fg)}
.field:focus{outline:none;border-color:var(--accent)}
textarea.field{resize:none;line-height:1.5;display:block}
.chips{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.pick{padding:8px 14px;border-radius:999px;border:1.5px solid var(--line-strong);font-size:.875rem;color:var(--muted)}
.pick[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--accent-ink);font-weight:700}
.pick.wd{min-width:44px;padding:8px 0;text-align:center}
.date{flex:1 1 150px;min-width:0;padding:8px 12px;border-radius:12px;font-size:16px}
.swatches{display:flex;gap:10px;flex-wrap:wrap}
.sw{width:40px;height:40px;border-radius:50%;background:var(--tc);color:transparent;display:grid;place-items:center}
.sw[aria-pressed="true"]{color:var(--on-c);outline:2px solid var(--fg);outline-offset:2px}
.acts{display:flex;gap:10px}
.btn{flex:1;padding:12px;border-radius:12px;font-weight:700;background:var(--surface-2)}
.btn.main{background:var(--accent);color:var(--accent-fg)}
.btn.danger{flex:none;background:none;color:var(--warn);padding:12px 8px}
.lab{font-size:.75rem;color:var(--muted);margin-bottom:6px;display:block}

/* undo toast */
.toast{position:fixed;left:0;right:0;z-index:12;margin:0 auto;max-width:calc(560px - 32px);width:calc(100% - 32px);
  bottom:calc(84px + env(safe-area-inset-bottom,0px));background:var(--fg);color:var(--bg);border-radius:12px;
  padding:10px 14px;display:flex;justify-content:space-between;align-items:center;gap:12px;font-size:.875rem;box-shadow:var(--shadow)}
.toast button{font-weight:700;text-decoration:underline;padding:4px}
</style>
</head>
<body>
<div class="wrap" id="app"></div>

<nav class="tabs" aria-label="メニュー">
  <div class="tabs-in">
    <button class="tab" data-act="tab" data-tab="today">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="8.5"/><path d="M8.5 12.5l2.5 2.5 4.5-5"/></svg>
      今日
    </button>
    <button class="plus" data-act="open" aria-label="追加する">
      <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
    </button>
    <button class="tab" data-act="tab" data-tab="habits">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 20V14M12 20V9M19 20V4"/></svg>
      習慣
    </button>
  </div>
</nav>

<div class="back" id="back" hidden data-act="close"></div>
<form class="sheet" id="sheet" hidden autocomplete="off" aria-label="追加・編集">
  <div class="seg" id="segBox" role="group" aria-label="種類">
    <button type="button" data-act="type" data-type="task" aria-pressed="true">タスク</button>
    <button type="button" data-act="type" data-type="habit" aria-pressed="false">習慣</button>
  </div>
  <div>
    <label class="lab" for="newText" id="newLabel">やること</label>
    <input class="field" id="newText" maxlength="80" placeholder="例: 郵便を出す" enterkeyhint="done">
  </div>
  <div id="memoBox">
    <label class="lab" for="newMemo">メモ(任意)</label>
    <textarea class="field" id="newMemo" rows="2" maxlength="400" placeholder="詳しいことや持ち物など"></textarea>
  </div>
  <div id="dueBox">
    <span class="lab">期限</span>
    <div class="chips" role="group" aria-label="期限">
      <button type="button" class="pick" data-act="due" data-due="today" aria-pressed="false">今日</button>
      <button type="button" class="pick" data-act="due" data-due="tomorrow" aria-pressed="false">明日</button>
      <button type="button" class="pick" data-act="due" data-due="none" aria-pressed="false">期限なし</button>
      <input class="field date" type="date" id="dueDate" aria-label="日付を選ぶ">
    </div>
  </div>
  <div id="colorBox">
    <span class="lab">色</span>
    <div class="swatches" id="swatches" role="group" aria-label="色"></div>
  </div>
  <div id="daysBox" hidden>
    <span class="lab">曜日</span>
    <div class="chips" id="dayPicks" role="group" aria-label="曜日"></div>
  </div>
  <div class="acts">
    <button type="button" class="btn danger" id="delBtn" data-act="del" hidden>削除</button>
    <button type="button" class="btn" data-act="close">キャンセル</button>
    <button type="submit" class="btn main" id="saveBtn">追加</button>
  </div>
</form>
<div class="toast" id="toast" role="status" hidden><span id="toastMsg"></span><button type="button" data-act="undo">元に戻す</button></div>

<script>
(function(){
'use strict';
var KEY='hitotsuzutsu.v1';
var DAYS=['日','月','火','水','木','金','土'];
var ORDER=[1,2,3,4,5,6,0];
var COLORS=[['teal','ティール'],['blue','ブルー'],['violet','パープル'],['pink','ピンク'],['red','レッド'],['orange','オレンジ'],['green','グリーン'],['gray','グレー']];
var CHECK='<svg width="22" height="22" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg>';
var CHECK_S='<svg width="16" height="16" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/></svg>';
var XICON='<svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg>';
var GRIP='<button type="button" class="grip" aria-label="ドラッグして移動（上下キーで並べ替え）"><svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><circle cx="9" cy="5.5" r="1.8"/><circle cx="15" cy="5.5" r="1.8"/><circle cx="9" cy="12" r="1.8"/><circle cx="15" cy="12" r="1.8"/><circle cx="9" cy="18.5" r="1.8"/><circle cx="15" cy="18.5" r="1.8"/></svg></button>';
var CHEV_L='<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>';
var CHEV_R='<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 5l7 7-7 7"/></svg>';

function pad(n){return n<10?'0'+n:''+n}
function ymd(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())}
function parse(s){var p=s.split('-');return new Date(+p[0],+p[1]-1,+p[2])}
function addDays(s,n){var d=parse(s);d.setDate(d.getDate()+n);return ymd(d)}
function diffDays(a,b){return Math.round((parse(a)-parse(b))/86400000)}
function md(s){var d=parse(s);return (d.getMonth()+1)+'/'+d.getDate()}
function uid(){return Math.random().toString(36).slice(2,9)}
function esc(s){return String(s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function firstLine(s){return String(s).split(/\r?\n/)[0]}
function colorKey(t){
  var i;
  for(i=0;i<COLORS.length;i++){if(COLORS[i][0]===t.color)return t.color}
  return 'teal';
}

var today=ymd(new Date());
var S=null, isStarter=false, tab='today', showDone=false;
var ref=null, ver=0, savedVer=0, saving=false, timer=null, status='local';
var sh=null, undoSnap=null, toastTimer=null;

/* ---------- state ---------- */
function starter(){
  var t=today, log={};
  var h1={id:uid(),name:'朝に水を飲む',created:addDays(t,-6),sample:1};
  var h2={id:uid(),name:'10分だけ読書',created:addDays(t,-6),sample:1};
  var h3={id:uid(),name:'ストレッチ（月・水・金）',created:addDays(t,-6),days:[1,3,5],sample:1};
  function mark(d,id){(log[d]=log[d]||[]).push(id)}
  [1,2,3,4].forEach(function(n){mark(addDays(t,-n),h1.id)});
  [1,2].forEach(function(n){mark(addDays(t,-n),h2.id)});
  return {v:1,habits:[h1,h2,h3],log:log,tasks:[
    {id:uid(),text:'洗濯物を取り込む',memo:'',due:t,done:false,color:'green',sample:1},
    {id:uid(),text:'請求書を確認する',memo:'今月分。金額が先月と違わないか見る',due:addDays(t,1),done:false,color:'blue',sample:1},
    {id:uid(),text:'友人に返信する',memo:'',due:addDays(t,2),done:false,color:'pink',sample:1},
    {id:uid(),text:'旅行の候補を調べる',memo:'',due:null,done:false,color:'violet',sample:1}
  ]};
}
function normalize(d){
  var o=JSON.parse(JSON.stringify(d||{}));
  if(!Array.isArray(o.habits))o.habits=[];
  if(!Array.isArray(o.tasks))o.tasks=[];
  if(!o.log||typeof o.log!=='object')o.log={};
  o.v=1;return o;
}
function loadLocal(){try{var r=localStorage.getItem(KEY);return r?normalize(JSON.parse(r)):null}catch(e){return null}}
function saveLocal(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}

function changed(){
  isStarter=false; ver++; saveLocal(); scheduleCloud(); render();
}
function scheduleCloud(){
  if(!ref)return;
  status='saving'; clearTimeout(timer); timer=setTimeout(flush,600);
}
function flush(){
  if(!ref)return;
  if(saving){clearTimeout(timer);timer=setTimeout(flush,300);return}
  saving=true;
  var v=ver, snap=JSON.parse(JSON.stringify(S));
  ref.set(snap).then(function(){
    savedVer=v; status=(ver===v)?'saved':'saving';
  },function(){
    status='error';
  }).then(function(){
    saving=false;
    if(ver!==savedVer && status!=='error'){clearTimeout(timer);timer=setTimeout(flush,200)}
    renderSync();
  });
}
function initCloud(){
  var c=window.claude;
  if(!c||typeof c.use!=='function')return;
  Promise.all([c.use('user'),c.use('db')]).then(function(r){
    var user=r[0], db=r[1];
    if(!user||!db)return;
    return user.id().then(function(id){
      if(!id)return;
      var rf=db.doc('data/users/'+id+'/tracker');
      return rf.get().then(function(snap){
        ref=rf;
        var d=snap.exists?snap.data():null;
        if(d&&Array.isArray(d.habits)){
          if(ver===0){S=normalize(d);isStarter=false;saveLocal();status='saved'}
          else scheduleCloud();
        }else if(!isStarter){
          scheduleCloud();
        }else{
          status='saved';
        }
        render();
      });
    });
  }).catch(function(){ref=null;status='local';renderSync()});
}
function refreshFromCloud(){
  if(!ref||saving||drag||ver!==savedVer&&ver!==0)return;
  ref.get().then(function(snap){
    if(!snap.exists||drag||ver!==savedVer&&ver!==0)return;
    var d=normalize(snap.data());
    if(JSON.stringify(d)!==JSON.stringify(S)){S=d;isStarter=false;saveLocal();render()}
  },function(){});
}

/* ---------- queries ---------- */
function findTask(id){var i;for(i=0;i<S.tasks.length;i++){if(S.tasks[i].id===id)return S.tasks[i]}return null}
function findHabit(id){var i;for(i=0;i<S.habits.length;i++){if(S.habits[i].id===id)return S.habits[i]}return null}
function taskIndex(id){var i;for(i=0;i<S.tasks.length;i++){if(S.tasks[i].id===id)return i}return -1}
function done(id,date){var a=S.log[date];return !!a&&a.indexOf(id)>-1}
function isTarget(h,date){
  if(!h.days||!h.days.length||h.days.length>=7)return true;
  return h.days.indexOf(parse(date).getDay())>-1;
}
function hdays(h){
  if(!h.days||!h.days.length||h.days.length>=7)return '毎日';
  return ORDER.filter(function(d){return h.days.indexOf(d)>-1}).map(function(d){return DAYS[d]}).join('・');
}
function streak(h){
  var d=today,n=0,guard=0;
  while(guard<3700){
    guard++;
    if(isTarget(h,d)){
      if(done(h.id,d))n++;
      else if(d!==today)break;
    }else if(done(h.id,d)){n++}
    d=addDays(d,-1);
  }
  return n;
}
function rate(h){
  var start=addDays(today,-29);
  if(h.created>start)start=h.created;
  var total=diffDays(today,start)+1,tg=0,c=0,i,d;
  for(i=0;i<total;i++){
    d=addDays(start,i);
    if(isTarget(h,d)){tg++;if(done(h.id,d))c++}
  }
  return tg>0?Math.round(c/tg*100):0;
}
function dueInfo(t){
  if(!t.due)return null;
  var d=diffDays(t.due,today);
  if(d<0)return {label:'期限切れ',cls:'late'};
  if(d===0)return {label:'今日',cls:'today'};
  if(d===1)return {label:'明日',cls:''};
  return {label:md(t.due),cls:''};
}
function zoneOf(t){
  if(!t.due)return 'list';
  if(t.due<=today)return 'today';
  if(t.due<=addDays(today,7))return 'week';
  return 'list';
}
function hasSample(){
  return S.habits.some(function(h){return h.sample})||S.tasks.some(function(t){return t.sample});
}

/* ---------- actions ---------- */
function snapshotForUndo(msg){
  undoSnap=JSON.stringify(S);
  var el=document.getElementById('toast');
  document.getElementById('toastMsg').textContent=msg;
  el.hidden=false;
  clearTimeout(toastTimer);
  toastTimer=setTimeout(function(){el.hidden=true;undoSnap=null},5000);
}
function toggleHabit(id,date){
  if(date>today)return;
  var a=S.log[date]||[], i=a.indexOf(id);
  if(i>-1)a.splice(i,1);else a.push(id);
  if(a.length)S.log[date]=a;else delete S.log[date];
  changed();
}
function toggleTask(id){
  var t=findTask(id);
  if(!t)return;
  t.done=!t.done;t.doneAt=t.done?today:null;
  changed();
}
function deleteTask(id){
  snapshotForUndo('タスクを削除しました');
  S.tasks=S.tasks.filter(function(t){return t.id!==id});
  changed();
}
function deleteHabit(id){
  snapshotForUndo('習慣を削除しました');
  S.habits=S.habits.filter(function(h){return h.id!==id});
  Object.keys(S.log).forEach(function(d){
    S.log[d]=S.log[d].filter(function(x){return x!==id});
    if(!S.log[d].length)delete S.log[d];
  });
  changed();
}
function clearSamples(){
  snapshotForUndo('サンプルを消しました');
  var ids={};
  S.habits.forEach(function(h){if(h.sample)ids[h.id]=1});
  S.habits=S.habits.filter(function(h){return !h.sample});
  S.tasks=S.tasks.filter(function(t){return !t.sample});
  Object.keys(S.log).forEach(function(d){
    S.log[d]=S.log[d].filter(function(x){return !ids[x]});
    if(!S.log[d].length)delete S.log[d];
  });
  changed();
}
function undo(){
  if(!undoSnap)return;
  S=normalize(JSON.parse(undoSnap));
  undoSnap=null;
  document.getElementById('toast').hidden=true;
  changed();
}
function setMsg(t){var m=document.getElementById('dataMsg');if(m)m.textContent=t}
function exportData(){
  var text=JSON.stringify(S), ta=document.getElementById('importText');
  function fallback(){
    if(ta){ta.value=text;ta.focus();ta.select();try{ta.setSelectionRange(0,text.length)}catch(e){}}
    setMsg('自動でコピーできませんでした。下の枠のテキストを長押しして、すべてコピーしてください。');
  }
  try{
    if(navigator.clipboard&&navigator.clipboard.writeText){
      navigator.clipboard.writeText(text).then(function(){setMsg('コピーしました。移す先の「貼り付け」欄に貼り付けてください。')},fallback);
    }else{fallback()}
  }catch(e){fallback()}
}
function importData(){
  var ta=document.getElementById('importText'), o=null;
  try{o=JSON.parse(ta.value.trim())}catch(e){}
  if(!o||!Array.isArray(o.habits)||!Array.isArray(o.tasks)){
    setMsg('データを読み取れませんでした。コピーしたデータ全体を貼り付けてください。');
    return;
  }
  snapshotForUndo('データを読み込みました');
  S=normalize(o);
  changed();
}
function habitIndex(id){var i;for(i=0;i<S.habits.length;i++){if(S.habits[i].id===id)return i}return -1}
/* to: today | week | list. Moving into a zone sets the due date to fit it. */
function applyMove(id,to,targetId,after){
  var i=taskIndex(id);
  if(i<0)return;
  var t=S.tasks.splice(i,1)[0];
  var from=zoneOf(t), tg=targetId?findTask(targetId):null;
  if(to==='today'){
    if(from!=='today')t.due=today;
  }else if(to==='list'){
    if(from!=='list')t.due=null;
  }else if(to==='week'){
    if(tg&&tg.due){
      t.due=tg.due;
    }else if(from!=='week'){
      var last=null;
      S.tasks.forEach(function(x){
        if(!x.done&&zoneOf(x)==='week'&&(!last||x.due>last))last=x.due;
      });
      t.due=last||addDays(today,1);
    }
  }
  var j=tg?taskIndex(targetId):-1;
  if(j<0)S.tasks.push(t);
  else S.tasks.splice(after?j+1:j,0,t);
  changed();
}
function applyHabitMove(id,targetId,after){
  var i=habitIndex(id);
  if(i<0)return;
  var h=S.habits.splice(i,1)[0];
  var j=targetId?habitIndex(targetId):-1;
  if(j<0)S.habits.push(h);
  else S.habits.splice(after?j+1:j,0,h);
  changed();
}
function nudge(id,kind,dir){
  var row=document.querySelector('[data-item="'+id+'"]');
  if(!row)return;
  var sib=dir<0?row.previousElementSibling:row.nextElementSibling;
  if(!sib||!sib.hasAttribute('data-item'))return;
  var sid=sib.getAttribute('data-item');
  if(kind==='habit'){
    var a=habitIndex(id), b=habitIndex(sid);
    if(a<0||b<0)return;
    var tmp=S.habits[a];S.habits[a]=S.habits[b];S.habits[b]=tmp;
    changed();
  }else{
    var zn=row.closest('[data-zone]');
    if(!zn)return;
    applyMove(id,zn.getAttribute('data-zone'),sid,dir>0);
  }
  var g=document.querySelector('[data-item="'+id+'"] .grip');
  if(g)g.focus();
}

/* ---------- drag and drop (pointer events, works with touch) ---------- */
var drag=null;
function clearMarks(){
  var m=document.querySelectorAll('.over,.drop-before,.drop-after'),i;
  for(i=0;i<m.length;i++){m[i].classList.remove('over');m[i].classList.remove('drop-before');m[i].classList.remove('drop-after')}
}
function dragStart(e,grip){
  if(drag)return;
  if(e.pointerType==='mouse'&&e.button!==0)return;
  var row=grip.closest('[data-item]');
  if(!row)return;
  e.preventDefault();
  var r=row.getBoundingClientRect();
  var ghost=row.cloneNode(true);
  ghost.removeAttribute('data-item');
  ghost.classList.add('ghost');
  ghost.style.width=r.width+'px';
  ghost.style.left=r.left+'px';
  ghost.style.top=r.top+'px';
  document.body.appendChild(ghost);
  row.classList.add('dragging');
  document.body.classList.add('is-dragging');
  drag={id:row.getAttribute('data-item'),kind:row.getAttribute('data-kind'),row:row,ghost:ghost,grip:grip,pid:e.pointerId,
        dx:e.clientX-r.left,dy:e.clientY-r.top,x:e.clientX,y:e.clientY,
        zone:null,target:null,after:false,self:false,raf:0};
  try{grip.setPointerCapture(e.pointerId)}catch(err){}
  document.addEventListener('pointermove',dragMove);
  document.addEventListener('pointerup',dragEnd);
  document.addEventListener('pointercancel',dragCancel);
  drag.raf=requestAnimationFrame(dragTick);
}
function dragMove(e){
  if(!drag||e.pointerId!==drag.pid)return;
  drag.x=e.clientX;drag.y=e.clientY;
  e.preventDefault();
}
function updateTarget(){
  clearMarks();
  drag.zone=null;drag.target=null;drag.self=false;drag.after=false;
  var el=document.elementFromPoint(drag.x,drag.y);
  if(!el||!el.closest)return;
  var zone=el.closest('[data-drop]');
  if(!zone||zone.getAttribute('data-drop')!==drag.kind)return;
  drag.zone=zone;
  zone.classList.add('over');
  var items=zone.querySelectorAll('[data-item]'), i, r, cand=null, after=false;
  var rowEl=el.closest('[data-item]');
  if(rowEl&&zone.contains(rowEl)){
    r=rowEl.getBoundingClientRect();
    cand=rowEl;
    after=drag.y>r.top+r.height/2;
  }else{
    for(i=0;i<items.length;i++){
      r=items[i].getBoundingClientRect();
      cand=items[i];
      if(drag.y<r.top+r.height/2){after=false;break}
      after=true;
    }
  }
  if(!cand)return;
  if(cand===drag.row){drag.self=true;return}
  drag.target=cand.getAttribute('data-item');
  drag.after=after;
  cand.classList.add(after?'drop-after':'drop-before');
}
function dragTick(){
  if(!drag)return;
  var h=window.innerHeight,y=drag.y;
  if(y<90)window.scrollBy(0,-Math.ceil((90-y)/5));
  else if(y>h-140)window.scrollBy(0,Math.ceil((y-(h-140))/5));
  drag.ghost.style.left=(drag.x-drag.dx)+'px';
  drag.ghost.style.top=(drag.y-drag.dy)+'px';
  updateTarget();
  drag.raf=requestAnimationFrame(dragTick);
}
function finishDrag(apply){
  var d=drag;
  if(!d)return;
  cancelAnimationFrame(d.raf);
  document.removeEventListener('pointermove',dragMove);
  document.removeEventListener('pointerup',dragEnd);
  document.removeEventListener('pointercancel',dragCancel);
  try{d.grip.releasePointerCapture(d.pid)}catch(err){}
  if(d.ghost.parentNode)d.ghost.parentNode.removeChild(d.ghost);
  d.row.classList.remove('dragging');
  document.body.classList.remove('is-dragging');
  clearMarks();
  drag=null;
  if(apply&&d.zone&&!d.self){
    if(d.kind==='habit')applyHabitMove(d.id,d.target,d.after);
    else applyMove(d.id,d.zone.getAttribute('data-zone'),d.target,d.after);
  }
}
function dragEnd(e){
  if(!drag||e.pointerId!==drag.pid)return;
  drag.x=e.clientX;drag.y=e.clientY;
  updateTarget();
  finishDrag(true);
}
function dragCancel(e){
  if(!drag||e.pointerId!==drag.pid)return;
  finishDrag(false);
}

/* ---------- render ---------- */
function header(eyebrow,title){
  return '<header class="top"><div><div class="eyebrow">'+eyebrow+'</div><h1>'+title+'</h1></div><div class="sync" id="sync"></div></header>';
}
function progress(label,d,total){
  var pct=total?Math.round(d/total*100):0;
  var v=total?d+'<small> / '+total+'</small>':'<small>まだありません</small>';
  return '<div class="stat"><span class="k">'+label+'</span><span class="v">'+v+'</span>'+
    '<div class="bar" role="progressbar" aria-label="'+label+'" aria-valuemin="0" aria-valuemax="100" aria-valuenow="'+pct+'"><i style="width:'+pct+'%"></i></div></div>';
}
function habitRow(h){
  var on=done(h.id,today), s=streak(h);
  return '<li class="row has-grip'+(on?' is-done':'')+'" data-item="'+h.id+'" data-kind="habit">'+GRIP+
    '<button class="check" data-act="th" data-id="'+h.id+'" data-date="'+today+'" aria-pressed="'+on+'" aria-label="'+esc(h.name)+'">'+CHECK+'</button>'+
    '<div class="t"><span>'+esc(h.name)+'</span><small>'+(s>0?'連続 '+s+'日':'今日から始めよう')+'</small></div></li>';
}
/* zone: today | week | list | done */
function taskRow(t,zone){
  var c=colorKey(t), di=dueInfo(t), grip=(zone!=='done'), chip='';
  if(!t.done&&di){
    if(zone==='today'&&di.cls==='late')chip='<span class="chip late">'+di.label+'</span>';
    else if(zone==='week')chip='<span class="chip">'+md(t.due)+'（'+DAYS[parse(t.due).getDay()]+'）</span>';
    else if(zone==='list')chip='<span class="chip '+di.cls+'">'+di.label+'</span>';
  }
  var memo=t.memo?'<small class="memo">'+esc(firstLine(t.memo))+'</small>':'';
  return '<li class="row tint'+(grip?' has-grip':'')+(t.done?' is-done':'')+'" data-item="'+t.id+'" data-kind="task" style="--tc:var(--c-'+c+')">'+
    (grip?GRIP:'')+
    '<button class="check sq" data-act="tt" data-id="'+t.id+'" aria-pressed="'+t.done+'" aria-label="'+esc(t.text)+'を完了にする">'+CHECK+'</button>'+
    '<button class="t" data-act="edit" data-id="'+t.id+'" aria-label="'+esc(t.text)+'を編集"><span>'+esc(t.text)+'</span>'+memo+'</button>'+
    chip+'</li>';
}
function zoneUl(zone,inner){
  return '<ul class="group" data-drop="task" data-zone="'+zone+'">'+inner+'</ul>';
}
function renderToday(){
  var d=new Date();
  var hs=S.habits.filter(function(h){return isTarget(h,today)||done(h.id,today)});
  var hDone=hs.filter(function(h){return done(h.id,today)}).length;
  var openAll=S.tasks.filter(function(t){return !t.done});
  var doneT=S.tasks.filter(function(t){return t.done});
  var tList=openAll.filter(function(t){return zoneOf(t)==='today'});
  var lList=openAll.filter(function(t){return zoneOf(t)==='list'});
  var wList=openAll.map(function(t,i){return {t:t,i:i}}).filter(function(o){return zoneOf(o.t)==='week'})
    .sort(function(a,b){return a.t.due.localeCompare(b.t.due)||a.i-b.i}).map(function(o){return o.t});
  var doneToday=doneT.filter(function(t){return t.doneAt===today}).length;
  doneT.sort(function(a,b){return (b.doneAt||'').localeCompare(a.doneAt||'')});

  var h=header('今日',(d.getMonth()+1)+'月'+d.getDate()+'日（'+DAYS[d.getDay()]+'）');
  h+='<p class="hint">左のつまみをドラッグすると、並べ替えや欄の移動ができます。</p>';
  h+='<div class="stats">'+progress('習慣',hDone,hs.length)+progress('タスク',doneToday,tList.length+doneToday)+'</div>';
  if(hasSample())h+='<div class="note"><span>サンプルを入れてあります。自由に消して使えます。</span><button data-act="clr">サンプルを消す</button></div>';

  h+='<section class="sec"><div class="sec-h"><h2>習慣</h2><span class="n">'+hDone+'/'+hs.length+'</span></div>';
  h+=hs.length?'<ul class="group" data-drop="habit" data-zone="habits">'+hs.map(habitRow).join('')+'</ul>':'<div class="group empty">'+(S.habits.length?'今日の習慣はありません。':'毎日続けたいことを、＋から習慣として追加できます。')+'</div>';
  h+='</section>';

  h+='<section class="sec"><div class="sec-h"><h2>今日のタスク</h2><div class="hr"><span class="n">残り '+tList.length+'</span><button class="mini" data-act="addto" data-due="today">＋ 追加</button></div></div>';
  h+=zoneUl('today',tList.length?tList.map(function(t){return taskRow(t,'today')}).join(''):'<li class="drop-empty">'+(doneToday?'今日のタスクはすべて完了しました。':'今日のタスクはありません。ここへドラッグできます')+'</li>');
  h+='</section>';

  h+='<section class="sec"><div class="sec-h"><h2>一週間のタスク</h2><div class="hr"><span class="n">'+wList.length+'件</span><button class="mini" data-act="addto" data-due="tomorrow">＋ 追加</button></div></div>';
  h+=zoneUl('week',wList.length?wList.map(function(t){return taskRow(t,'week')}).join(''):'<li class="drop-empty">明日から7日以内のタスクがここに並びます。ここへドラッグできます</li>');
  h+='</section>';

  h+='<section class="sec"><div class="sec-h"><h2>タスク一覧</h2><div class="hr"><span class="n">'+lList.length+'件</span><button class="mini" data-act="addto" data-due="none">＋ 追加</button></div></div>';
  h+=zoneUl('list',lList.length?lList.map(function(t){return taskRow(t,'list')}).join(''):'<li class="drop-empty">期限なし・8日以降のタスクがここに並びます</li>');
  if(doneT.length){
    h+='<button class="link" data-act="sd" aria-expanded="'+showDone+'">完了済み '+doneT.length+'件を'+(showDone?'隠す':'見る')+'</button>';
    if(showDone)h+='<ul class="group">'+doneT.slice(0,20).map(function(t){return taskRow(t,'done')}).join('')+'</ul>';
  }
  h+='</section>';
  h+='<details class="data"><summary>データの引き継ぎ・バックアップ</summary><div class="datab">'+
    '<p>別の端末やアプリへデータを移すときに使います。移す元で「コピー」を押し、移す先の欄に貼り付けて「読み込む」を押してください。</p>'+
    '<button type="button" class="btn" data-act="export">データをコピー</button>'+
    '<textarea class="field" id="importText" rows="3" placeholder="コピーしたデータをここに貼り付け" aria-label="読み込むデータ"></textarea>'+
    '<button type="button" class="btn main" data-act="import">読み込む（今のデータを置き換え）</button>'+
    '<div class="msg" id="dataMsg" role="status"></div></div></details>';
  return h;
}
function renderHabits(){
  var days=[],i;
  for(i=6;i>=0;i--)days.push(addDays(today,-i));
  var h=header('直近7日','習慣');
  if(!S.habits.length){
    return h+'<div class="group empty">まだ習慣がありません。＋から最初の1つを追加しましょう。</div>';
  }
  h+='<p class="hint">左のつまみをドラッグすると、並べ替えられます。</p>';
  h+='<ul class="cards" data-drop="habit" data-zone="habits">'+S.habits.map(function(hb){
    var s=streak(hb);
    var week=days.map(function(dt){
      var on=done(hb.id,dt), isT=dt===today, p=parse(dt);
      return '<button class="day'+(isT?' is-today':'')+(isTarget(hb,dt)?'':' off')+'" data-act="th" data-id="'+hb.id+'" data-date="'+dt+'" aria-pressed="'+on+'" aria-label="'+esc(hb.name)+' '+(p.getMonth()+1)+'月'+p.getDate()+'日">'+
        '<span class="dl">'+DAYS[p.getDay()]+'</span><span class="dc">'+CHECK_S+'</span><span class="dn">'+p.getDate()+'</span></button>';
    }).join('');
    return '<li class="hcard" data-item="'+hb.id+'" data-kind="habit"><div class="hhead"><div class="hleft">'+GRIP+'<div><button class="hname" data-act="edith" data-id="'+hb.id+'" aria-label="'+esc(hb.name)+'を編集">'+esc(hb.name)+'</button>'+
      '<div class="hmeta">'+hdays(hb)+' ・ 連続 <b>'+s+'</b>日 ・ 達成率 <b>'+rate(hb)+'</b>%</div></div></div>'+
      '<button class="del" data-act="dh" data-id="'+hb.id+'" aria-label="'+esc(hb.name)+'を削除">削除</button></div>'+
      '<div class="week">'+week+'</div></li>';
  }).join('')+'</ul>';
  return h;
}
function renderSync(){
  var el=document.getElementById('sync');
  if(!el)return;
  var m={local:'この端末に保存',saving:'保存中…',saved:'アカウントに保存済み',error:'同期できませんでした。この端末には保存済み'};
  el.textContent=m[status]||'';
}
function render(){
  var html=tab==='habits'?renderHabits():renderToday();
  document.getElementById('app').innerHTML=html;
  var tabs=document.querySelectorAll('.tab'),i;
  for(i=0;i<tabs.length;i++){
    if(tabs[i].getAttribute('data-tab')===tab)tabs[i].setAttribute('aria-current','page');
    else tabs[i].removeAttribute('aria-current');
  }
  renderSync();
}

/* ---------- add / edit sheet ---------- */
function buildPickers(){
  document.getElementById('swatches').innerHTML=COLORS.map(function(c){
    return '<button type="button" class="sw" data-act="col" data-c="'+c[0]+'" style="--tc:var(--c-'+c[0]+')" aria-pressed="false" aria-label="'+c[1]+'">'+CHECK_S+'</button>';
  }).join('');
  document.getElementById('dayPicks').innerHTML=ORDER.map(function(d){
    return '<button type="button" class="pick wd" data-act="wd" data-d="'+d+'" aria-pressed="false">'+DAYS[d]+'</button>';
  }).join('');
}
function syncSheet(){
  var isHabit=sh.type==='habit', edit=sh.mode==='edit', i, b;
  document.getElementById('segBox').hidden=edit;
  b=document.querySelectorAll('[data-act="type"]');
  for(i=0;i<b.length;i++)b[i].setAttribute('aria-pressed',b[i].getAttribute('data-type')===sh.type?'true':'false');
  document.getElementById('memoBox').hidden=isHabit;
  document.getElementById('dueBox').hidden=isHabit;
  document.getElementById('colorBox').hidden=isHabit;
  document.getElementById('daysBox').hidden=!isHabit;
  document.getElementById('newLabel').textContent=isHabit?'続けたいこと':'やること';
  document.getElementById('newText').placeholder=isHabit?'例: 寝る前に日記を書く':'例: 郵便を出す';
  document.getElementById('saveBtn').textContent=edit?'保存':'追加';
  document.getElementById('delBtn').hidden=!edit;
  var dueVals={today:today,tomorrow:addDays(today,1),none:''};
  b=document.querySelectorAll('[data-act="due"]');
  for(i=0;i<b.length;i++)b[i].setAttribute('aria-pressed',dueVals[b[i].getAttribute('data-due')]===sh.due?'true':'false');
  document.getElementById('dueDate').value=sh.due||'';
  b=document.querySelectorAll('[data-act="col"]');
  for(i=0;i<b.length;i++)b[i].setAttribute('aria-pressed',b[i].getAttribute('data-c')===sh.color?'true':'false');
  b=document.querySelectorAll('[data-act="wd"]');
  for(i=0;i<b.length;i++)b[i].setAttribute('aria-pressed',sh.days.indexOf(+b[i].getAttribute('data-d'))>-1?'true':'false');
}
function openSheet(mode,type,id,due0){
  sh={mode:mode,type:type,id:id||null,due:today,color:'teal',days:[0,1,2,3,4,5,6]};
  var text='',memo='',t,h;
  if(mode==='edit'){
    if(type==='task'){
      t=findTask(id);
      if(!t)return;
      text=t.text;memo=t.memo||'';sh.due=t.due||'';sh.color=colorKey(t);
    }else{
      h=findHabit(id);
      if(!h)return;
      text=h.name;
      if(h.days&&h.days.length)sh.days=h.days.slice();
    }
  }
  if(mode==='add'&&due0!==undefined)sh.due=due0;
  document.getElementById('newText').value=text;
  document.getElementById('newMemo').value=memo;
  syncSheet();
  document.getElementById('back').hidden=false;
  document.getElementById('sheet').hidden=false;
  if(mode==='add'){setTimeout(function(){document.getElementById('newText').focus()},30)}
}
function closeSheet(){
  document.getElementById('back').hidden=true;
  document.getElementById('sheet').hidden=true;
  sh=null;
}
function submitSheet(){
  var inp=document.getElementById('newText');
  var text=inp.value.replace(/\s+/g,' ').trim();
  if(!text){inp.focus();return false}
  var memo=document.getElementById('newMemo').value.trim();
  var days=ORDER.filter(function(d){return sh.days.indexOf(d)>-1});
  var t,h;
  if(sh.type==='habit'){
    if(sh.mode==='edit'){
      h=findHabit(sh.id);
      if(h){h.name=text;h.days=days.length>=7?null:days;if(!h.days)delete h.days}
    }else{
      h={id:uid(),name:text,created:today};
      if(days.length<7)h.days=days;
      S.habits.push(h);
      tab='habits';
    }
  }else{
    if(sh.mode==='edit'){
      t=findTask(sh.id);
      if(t){t.text=text;t.memo=memo;t.due=sh.due||null;t.color=sh.color}
    }else{
      S.tasks.push({id:uid(),text:text,memo:memo,due:sh.due||null,done:false,color:sh.color});
      if(tab==='habits')tab='today';
    }
  }
  closeSheet();
  changed();
  return true;
}

/* ---------- events ---------- */
document.addEventListener('click',function(e){
  var el=e.target.closest('[data-act]');
  if(!el)return;
  var act=el.getAttribute('data-act'), id=el.getAttribute('data-id');
  if(act==='tab'){tab=el.getAttribute('data-tab');render();window.scrollTo(0,0)}
  else if(act==='th')toggleHabit(id,el.getAttribute('data-date'));
  else if(act==='tt')toggleTask(id);
  else if(act==='dt')deleteTask(id);
  else if(act==='dh')deleteHabit(id);
  else if(act==='edit')openSheet('edit','task',id);
  else if(act==='edith')openSheet('edit','habit',id);
  else if(act==='sd'){showDone=!showDone;render()}
  else if(act==='clr')clearSamples();
  else if(act==='undo')undo();
  else if(act==='export')exportData();
  else if(act==='import')importData();
  else if(act==='open')openSheet('add',tab==='habits'?'habit':'task');
  else if(act==='addto'){
    var ad=el.getAttribute('data-due');
    openSheet('add','task',null,ad==='none'?'':ad==='tomorrow'?addDays(today,1):today);
  }
  else if(act==='close')closeSheet();
  else if(act==='del'){
    if(sh&&sh.mode==='edit'){
      var did=sh.id, dtype=sh.type;
      closeSheet();
      if(dtype==='habit')deleteHabit(did);else deleteTask(did);
    }
  }
  else if(act==='type'&&sh){sh.type=el.getAttribute('data-type');syncSheet()}
  else if(act==='due'&&sh){
    var k=el.getAttribute('data-due');
    sh.due=k==='today'?today:k==='tomorrow'?addDays(today,1):'';
    syncSheet();
  }
  else if(act==='col'&&sh){sh.color=el.getAttribute('data-c');syncSheet()}
  else if(act==='wd'&&sh){
    var n=+el.getAttribute('data-d'), p=sh.days.indexOf(n);
    if(p>-1){if(sh.days.length>1)sh.days.splice(p,1)}
    else sh.days.push(n);
    syncSheet();
  }
});
document.addEventListener('pointerdown',function(e){
  var g=e.target.closest?e.target.closest('.grip'):null;
  if(g)dragStart(e,g);
});
document.addEventListener('contextmenu',function(e){
  if(drag||(e.target.closest&&e.target.closest('.grip')))e.preventDefault();
});
document.getElementById('dueDate').addEventListener('change',function(e){
  if(sh){sh.due=e.target.value||'';syncSheet()}
});
document.getElementById('sheet').addEventListener('submit',function(e){
  e.preventDefault();
  if(sh)submitSheet();
});
document.addEventListener('keydown',function(e){
  var g=e.target.closest?e.target.closest('.grip'):null;
  if(g&&(e.key==='ArrowUp'||e.key==='ArrowDown')){
    e.preventDefault();
    var row=g.closest('[data-item]');
    if(row)nudge(row.getAttribute('data-item'),row.getAttribute('data-kind'),e.key==='ArrowUp'?-1:1);
    return;
  }
  if(e.key==='Escape'&&!document.getElementById('sheet').hidden)closeSheet();
});
document.addEventListener('visibilitychange',function(){
  if(document.visibilityState!=='visible')return;
  var t=ymd(new Date());
  if(t!==today&&!drag){today=t;render()}
  refreshFromCloud();
});

/* ---------- boot ---------- */
S=loadLocal();
if(!S){S=starter();isStarter=true}
buildPickers();
render();
initCloud();
})();
</script>

if('serviceWorker' in navigator&&/^https?:$/.test(location.protocol)){
  window.addEventListener('load',function(){navigator.serviceWorker.register('sw.js').catch(function(){})});
}
</script>
